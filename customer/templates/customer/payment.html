{% extends 'customer/master_customer.html' %}

{% block content %}
<div class="py-40 text-center">
    <h2 class="serif-title text-3xl mb-4">Secure Checkout</h2>

    <p class="text-slate-500 mb-8 text-sm">
        Click Pay Now to complete your payment.
    </p>

    <button type="button" id="rzp-button"
        class="px-10 py-4 bg-slate-900 text-white rounded-2xl font-bold uppercase tracking-widest text-[10px]">
        Pay Now ₹{{ order.total_amount }}
    </button>

    <p id="payment-error" class="text-red-600 text-sm mt-4"></p>
</div>

<form id="payment-verify-form"
      method="post"
      action="{% url 'customer:payment_verify' %}"
      hidden>
    {% csrf_token %}
    <input type="hidden" name="order_id" value="{{ order.order_id }}">
    <input type="hidden" name="razorpay_payment_id">
    <input type="hidden" name="razorpay_order_id">
    <input type="hidden" name="razorpay_signature">
</form>

{{ payment_options|json_script:"razorpay-options" }}

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
(function () {
    const button = document.getElementById("rzp-button");
    const errorBox = document.getElementById("payment-error");
    const form = document.getElementById("payment-verify-form");

    let checkout;

    button.addEventListener("click", function () {
        errorBox.textContent = "";

        try {
            if (typeof window.Razorpay !== "function") {
                throw new Error(
                    "Razorpay could not load. Check your connection or browser blockers."
                );
            }

            if (!checkout) {
                const options = JSON.parse(
                    document.getElementById("razorpay-options").textContent
                );

                options.amount = Number(options.amount);

                if (!options.key || !options.order_id ||
                    !Number.isFinite(options.amount) || options.amount <= 0) {
                    throw new Error(
                        "Payment details are missing or invalid."
                    );
                }

                options.handler = function (response) {
                    button.disabled = true;
                    button.textContent = "Verifying payment…";

                    form.elements.namedItem("razorpay_payment_id").value =
                        response.razorpay_payment_id;

                    form.elements.namedItem("razorpay_order_id").value =
                        response.razorpay_order_id;

                    form.elements.namedItem("razorpay_signature").value =
                        response.razorpay_signature;

                    form.submit();
                };

                checkout = new Razorpay(options);

                checkout.on("payment.failed", function (response) {
                    errorBox.textContent =
                        response.error.description ||
                        "Payment failed. Please try again.";
                });
            }

            checkout.open();
        } catch (error) {
            console.error("Checkout error:", error);
            errorBox.textContent = error.message;
        }
    });
})();
</script>
{% endblock %}
