{% extends 'customer/master_customer.html' %}
{% block content %}
<div class="py-40 text-center">
    <h2 class="serif-title text-3xl mb-4">Secure Checkout</h2>
    <p class="text-slate-500 mb-8 text-sm">Please do not refresh or go back.</p>
    <button type="button" id="rzp-button"
    class="px-10 py-4 bg-slate-900 text-white rounded-2xl font-bold uppercase tracking-widest text-[10px]">
    Pay Now ₹{{ order.total_amount }}
    </button>
    <p id="payment-error" class="text-red-600 text-sm mt-4"></p>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
(function () {
    const button = document.getElementById("rzp-button");
    const errorBox = document.getElementById("payment-error");

    button.addEventListener("click", function (event) {
        event.preventDefault();
        errorBox.textContent = "";

        if (typeof window.Razorpay !== "function") {
            errorBox.textContent =
                "Razorpay could not load. Check your connection or browser blockers.";
            return;
        }

        const options = {
            key: "{{ razorpay_key|escapejs }}",
            amount: Number("{{ amount|escapejs }}"),
            currency: "INR",
            name: "KitabHub",
            order_id: "{{ razorpay_order_id|escapejs }}",
            handler: function (response) {
                const params = new URLSearchParams({
                    order_id: "{{ order.order_id|escapejs }}",
                    payment_id: response.razorpay_payment_id,
                    signature: response.razorpay_signature
                });

                window.location.href =
                    "/customer/payment-verify/?" + params.toString();
            },
            theme: {
                color: "#064e3b"
            }
        };
        console.log("Checkout context:", {
            keyLoaded: Boolean(options.key),
            orderIdLoaded: Boolean(options.order_id),
            amount: options.amount
        });

        if (!options.key || !options.order_id ||
            !Number.isFinite(options.amount) || options.amount <= 0) {
            errorBox.textContent =
                "Payment details are missing or invalid. Check the Django view context.";
            return;
        }

        try {
            const checkout = new Razorpay(options);

            checkout.on("payment.failed", function (response) {
                errorBox.textContent =
                    response.error.description || "Payment failed. Please retry.";
            });

            checkout.open();
        } catch (error) {
            console.error("Checkout error:", error);
            errorBox.textContent = error.message || "Unable to open checkout.";
        }
    });
})();
</script>
{% endblock %}
